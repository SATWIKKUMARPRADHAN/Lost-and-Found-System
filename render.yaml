services:
  - type: web
    name: campus-lostfound
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn campus_lostfound.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: campus-lostfound-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: campus-lostfound-db
    databaseName: campus_lostfound
    user: campus_user
    plan: free
